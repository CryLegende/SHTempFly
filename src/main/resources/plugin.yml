name: SHTempFly
version: '${project.version}'
main: org.Cry_Legende.sHTempFly.SHTempFly
api-version: '1.20'
author: Cry_Legende
description: Gestion du fly temporaire et illimité (zones, îles, minijeux).
softdepend:
  - WorldGuard
  - PlaceholderAPI
  - SuperiorSkyblock2
  # Facultatif : sans lui, le temps de vol reste dans le SQLite du serveur comme avant.
  - SHNetwork
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# HikariCP et le pilote MariaDB ne servent qu'au mode réseau (temps de vol en MariaDB).
libraries:
  - org.xerial:sqlite-jdbc:3.44.1.0
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  fly:
    description: Active / désactive le fly, ou affiche le temps restant.
    usage: /fly [on|off|time] [joueur]
    # tf et tempfly reprennent les alias de l'ancien plugin : les commandes
    # de type "/tf give <joueur> <temps>" configurées dans les plugins de
    # votes / boxes / quêtes continuent donc de fonctionner sans rien changer.
    aliases: [tf, tfly, tempfly]
  shtempfly:
    description: Commandes d'administration du fly.
    usage: /shtempfly <give|set|remove|giveall|check|reload|migrate>
    aliases: [shtf, flyadmin]

permissions:
  shtempfly.fly.unlimited:
    description: Fly illimité, sans timer, avec activation / désactivation.
    default: false
  shtempfly.fly.others:
    description: Active / désactive le fly d'un autre joueur.
    default: op
  shtempfly.bypass:
    description: Ignore toutes les restrictions de zone.
    default: op
  shtempfly.admin:
    description: Toutes les sous-commandes de /shtempfly et de /fly (give, remove, set, giveall, check, reload, migrate, netimport).
    default: op
    children:
      shtempfly.admin.give: true
      shtempfly.admin.remove: true
      shtempfly.admin.set: true
      shtempfly.admin.giveall: true
      shtempfly.admin.check: true
      shtempfly.admin.reload: true
      shtempfly.admin.migrate: true
      shtempfly.admin.netimport: true
  shtempfly.admin.give:
    description: Ajouter du temps de fly à un joueur (/shtempfly give, ancien nom add).
    default: op
  shtempfly.admin.remove:
    description: Retirer du temps de fly à un joueur (/shtempfly remove, ancien nom take).
    default: op
  shtempfly.admin.set:
    description: Définir le temps de fly d'un joueur (/shtempfly set).
    default: op
  shtempfly.admin.giveall:
    description: Ajouter du temps de fly à tous les joueurs (/shtempfly giveall, ancien nom addall).
    default: op
  shtempfly.admin.check:
    description: Consulte le temps de fly d'un joueur (/shtempfly check, /tfly check) sans les autres commandes d'administration.
    default: op
  shtempfly.admin.reload:
    description: Recharger config.yml et messages.yml (/shtempfly reload).
    default: op
  shtempfly.admin.migrate:
    description: Importer l'ancien TempFly (/shtempfly migrate, ancien nom import).
    default: op
  shtempfly.admin.netimport:
    description: Mode réseau, copier data.db dans la base du réseau (/shtempfly netimport).
    default: op
